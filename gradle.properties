org.gradle.jvmargs=-Xmx2048M

# 网络超时：避免单点仓库不可达时无限挂起（本环境 maven.neoforged.net 不可达，已由 BMCLAPI 镜像替代）
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=3

minecraft_version=1.21.1
enabled_platforms=neoforge

archives_base_name=jecalculation
mod_version=4.0.4
maven_group=me.towdium.jecalculation

# Architectury 13.x 支持 1.21.1 + NeoForge（13.0.x 起）
architectury_version=13.0.11

fabric_loader_version=0.16.9
fabric_api_version=0.107.0+1.21.1

# NeoForge 1.21.1：版本号形如 21.1.x，请按需 pin 到已知可用的构建（如 21.1.172 / 最新发布版 21.1.265）
neoforge_version=21.1.172

forge_version=1.21.1-52.0.1

quilt_loader_version=0.26.0-beta.8
quilt_fabric_api_version=10.2.0+0.107.0-1.21.1

# JEI 19.x 支持 1.21.1 NeoForge；-common-api 坐标由 common 模块按 minecraft_version 推导
jei_version=19.21.2.313
# REI 1.21.1 版本需核对实际发布号（此处为占位，请替换为 RoughlyEnoughItems 1.21.1 的真实版本）
rei_version=16.0.0
